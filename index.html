/* Layout: painel de operação à esquerda (abas por área da importadora), mentora Mia + diário à direita; stack no celular. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --fg:#1A2B4A; --muted:#5B6B82; --line:#D9E1EA;
  --brand:#00B386; --brand-ink:#0A7B5F; --soft:#E8F8F3; --navy:#1A2B4A; --navy-fg:#FFFFFF;
  --warn:#C98A00; --warn-soft:#FFF4D6; --bad:#D14343; --bad-soft:#FDE7E7; --good:#00B386;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Barlow",system-ui,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#162038; --fg:#E8EEF6; --muted:#9DAEC4; --line:#28385A;
  --brand:#1ED3A5; --brand-ink:#8FF0D2; --soft:#113A33; --navy:#0B1222; --navy-fg:#E8EEF6;
  --warn:#F2B53B; --warn-soft:#3A2E10; --bad:#F06C6C; --bad-soft:#3E1A1A; --good:#1ED3A5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#162038; --fg:#E8EEF6; --muted:#9DAEC4; --line:#28385A;
  --brand:#1ED3A5; --brand-ink:#8FF0D2; --soft:#113A33; --navy:#0B1222; --navy-fg:#E8EEF6;
  --warn:#F2B53B; --warn-soft:#3A2E10; --bad:#F06C6C; --bad-soft:#3E1A1A; --good:#1ED3A5; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;font-weight:800} h2{font-size:1.45rem;font-weight:800} h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button.primary{background:var(--brand);border-color:var(--brand);color:#06251C;font-weight:600}
button.ghost{background:transparent}
button.big{font-family:var(--display);font-size:1.3rem;font-weight:800;padding:12px 22px;border-radius:10px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
input[type=number]{width:7.5em}
.topbar{background:var(--navy);color:var(--navy-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
.topbar .brand{display:flex;align-items:center;gap:12px}
.mlogo{display:inline-flex;align-items:center;opacity:.85;padding-right:4px}
.topbar h1{font-family:"Press Start 2P",var(--display);font-size:1.05rem;font-weight:400;letter-spacing:0;line-height:1.3;padding-top:2px}
.mlogo img{display:block;width:auto}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);text-align:center}
.foot a{color:var(--brand-ink);font-weight:600}
.topbar .brand small{opacity:.75;font-size:.85rem}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-left:auto}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1}
.stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.stat.neg b{color:#FF8A8A}
.stat b{display:inline-block;transform-origin:left center}
@keyframes statUp{0%{color:#1ED3A5;transform:scale(1.1)}70%{color:#1ED3A5}100%{transform:none}}
@keyframes statDown{0%{color:#FF8A8A;transform:scale(1.1)}70%{color:#FF8A8A}100%{transform:none}}
@media (prefers-reduced-motion:no-preference){.stat.up b{animation:statUp 2s ease-out}.stat.down b{animation:statDown 2s ease-out}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.base{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.base canvas{max-width:100%;height:auto}
.base .cap{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:14px}
.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font-family:var(--display);font-size:1.1rem;font-weight:700;padding:8px 12px;margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel + .panel{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field > *{text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--bg);min-width:0}
.card.on{border-color:var(--brand);background:var(--soft)}
.card h3{font-size:1.05rem}
.card .m{font-size:.82rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto;min-width:0}
.tbl.dense table{font-size:.86rem}.tbl.dense th,.tbl.dense td{padding:5px 6px}.tbl.dense input[type=number],.tbl.dense select{padding:5px 6px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;letter-spacing:.03em}
.pill.verde{background:var(--soft);color:var(--brand-ink)} .pill.amarelo{background:var(--warn-soft);color:var(--warn)} .pill.vermelho{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)} .small{font-size:.85rem} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.mia{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.mia .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.mia .av{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.mia .tip{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.93rem}
.log{margin-top:12px;font-size:.84rem;max-height:40vh;overflow:auto}
.log div{padding:5px 0;border-top:1px solid var(--line)}
.log .t{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(10,18,34,.55);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin-bottom:8px}
.modal .body{display:flex;flex-direction:column;gap:10px}
.mia-note{display:flex;gap:10px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.92rem;margin-top:6px}
.mia-note .av{width:32px;height:32px;border-radius:8px;background:var(--surface);display:grid;place-items:center;flex:none}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:6px}
.opt:hover{border-color:var(--brand)}
.msg{background:var(--bg);border-left:3px solid var(--navy);padding:10px 12px;border-radius:0 8px 8px 0}
.msg .orig{font-size:1rem} .msg .tr{color:var(--muted);font-size:.9rem;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{font-family:var(--display);font-size:1.4rem;font-weight:700;display:block;line-height:1.1}
.kpi span{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.start{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.start .hero{background:var(--navy);color:var(--navy-fg);border-radius:16px;padding:22px}
.start .hero h1{font-size:3rem}
.start .hero p{opacity:.85;margin-top:8px;max-width:48ch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface);text-align:left}
.mode.on{border-color:var(--brand);background:var(--soft)}
.selos{display:flex;flex-wrap:wrap;gap:6px}
.explain{border-top:1px solid var(--line);padding:8px 0}
tr.prev td{color:var(--muted);font-style:italic}
.explain:first-of-type{border-top:0}
.share{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--bg)}
.share h3{text-align:center}
.selo{background:var(--navy);color:var(--navy-fg);border-radius:8px;padding:4px 10px;font-family:var(--display);font-weight:700;font-size:.95rem}
.cascade td:first-child{color:var(--muted)}
.cascade tr.total td{font-weight:700;border-top:2px solid var(--fg);color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.hot i{background:var(--warn)}
.cta{display:inline-block;background:var(--brand);color:#06251C;font-weight:700;padding:12px 18px;border-radius:10px;text-decoration:none;font-family:var(--display);font-size:1.2rem}
.tipbtn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--brand);background:transparent;color:var(--brand-ink);font:700 11px var(--body);padding:0;margin-left:6px;vertical-align:middle;cursor:help;line-height:1}
.tipbtn:hover{background:var(--soft)}
.tipbox{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--brand);border-radius:10px;padding:10px 12px;font-size:.88rem;line-height:1.4;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:400;text-transform:none;letter-spacing:0;text-align:left;white-space:normal}
.spr{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;flex:none}
.card .spr{float:right;margin:-2px 0 4px 8px}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:8px}.mhead h2{margin:0;flex:1}
.mclose{width:34px;height:34px;border-radius:50%;padding:0;font-size:1.3rem;line-height:1;flex:none;color:var(--muted)}
.mclose:hover{color:var(--fg);border-color:var(--fg)}
.base canvas{width:100%;max-width:720px;height:auto;border-radius:8px;display:block}
.hero-strip{display:flex;gap:18px;align-items:flex-end;margin-top:14px;flex-wrap:wrap}
.office-wrap{padding:8px 8px 10px}
#office{width:100%;max-width:720px;height:auto;display:block;border-radius:8px;cursor:pointer}
.rooms{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}/* só para leitores de tela e teclado: a planta é o seletor visual */
.walking{display:flex;align-items:center;gap:12px;color:var(--muted)}
.avatars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:520px){.avatars{grid-template-columns:repeat(3,1fr)}}
.mode.av{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;font-weight:600;font-size:.9rem}
.topbar .brand .spr{margin-right:4px}
@media (prefers-reduced-motion:no-preference){.card,.mode,button{transition:border-color .15s,background .15s}}
</style>

  const armazenagem=(armBase+armExtra*(sysLv(s)>=3?0.5:1))*(s.flags.portoX2===s.turn&&sysLv(s)<3?2:1);
  const ttd=filialOk(s);const baseIcms=(va+ii+ipi+pc+afrmm+siscomex)/(1-t.icms), icms=ttd?0:baseIcms*t.icms;

  const multa=canal==='vermelho'&&sh.ncmOk===false?5000:0;

   [`II ${pct(iiRate)}`,ii],[`IPI ${pct(pr.ipi)}`,ipi],['PIS/COFINS-importação 11,75%',pc],[ttd?'ICMS diferido no desembaraço (TTD 409 SC)':'ICMS 18% SP (por dentro)',icms,ttd?'sub':undefined],
   ['AFRMM 8% do frete marítimo',afrmm],['Taxa Siscomex (DUIMP + 1 adição)',siscomex],['Armazenagem',armazenagem],['Despachante',despachante],['Frete interno',freteInt],['Inspeção pré-embarque',inspecao],['Multa por declaração inexata (NCM)',multa]];

const fx=v=>(v>=0.995&&v<=1.005)?'1,00':v.toFixed(2).replace('.',',');
function explainMonth(r){const s=S;if(!r||!r.sales||!r.sales.length)return '<p class="small muted">Nenhum produto ativo neste mês: nada foi vendido nem procurado.</p>';
  const blocks=r.sales.map(x=>{const f=x.f||{};const dem=x.dem||{mp:0,b2b:0};const demTot=dem.mp+dem.b2b;const sold=x.qMp+x.qB;const diag=[];

    if(f.mkt>1.005)diag.push(`Marketing: demanda ×${fx(f.mkt)}.`);
    if(f.brand<0.995)diag.push(`Confiança da marca em ${Math.round(f.brand*100)}%: demanda ×${fx(f.brand)}.`);

    if(x.stockStart===0)diag.push(`<span class="bad">Sem estoque: ${demTot} clientes procuraram e não encontraram.</span>`);
    else if(x.unmet>0)diag.push(`<span class="bad">Estoque acabou: ${x.unmet} clientes (${Math.round(x.unmet/Math.max(1,demTot)*100)}% da demanda) saíram sem comprar.</span>`);

      <div class="small" style="margin-top:2px">Estoque <b>${x.stockStart}</b> → vendeu <b>${sold}</b> (${x.qMp} marketplace à vista, ${x.qB} B2B em 60 dias) → ${x.unmet>0?`<b class="bad">${x.unmet} sem atendimento</b>`:`sobraram <b>${x.left}</b>`}</div>
      ${diag.length?`<ul class="small" style="margin:6px 0 0 18px;padding:0">${diag.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}</div>`;}).join('');
  const dol=r.dollarPrev?`<p class="small muted" style="margin-top:6px">Dólar: ${fmtR(r.dollarPrev)} → ${fmtR(r.dollarNext)} (${r.dollarNext>=r.dollarPrev?'+':''}${((r.dollarNext/r.dollarPrev-1)*100).toFixed(1).replace('.',',')}%).</p>`:'';
  return `<p class="small muted">Demanda = base × sazonalidade × preço × marketing × confiança × eventos. O que você controla: preço, marketing, estoque.</p>${blocks}${dol}`;}

  const err=(!licOk(S,b.pid)&&p.anu.pre)?`${p.name} exige ${p.anu.label} antes do embarque. Solicite na sala de compras.`:rel(S,sup.id).blockedUntil>=S.turn?`${sup.name} não aceita pedidos seus até ${monthName(rel(S,sup.id).blockedUntil)}: você descumpriu o acordo de recorrência duas vezes.`:qty<moqOf(S,sup)?`Pedido mínimo deste fornecedor: ${moqOf(S,sup)} unidades.`:(M.maxFOB&&fobUSD>M.maxFOB)?`${M.name} aceita até ${fmtU(M.maxFOB)} FOB por remessa (você tem ${fmtU(fobUSD)}).`:m3<M.minM3?`${M.name} exige ao menos ${M.minM3} m³ (você tem ${m3.toFixed(1)}).`:m3>M.maxM3?`${M.name} aceita até ${M.maxM3} m³ (você tem ${m3.toFixed(1)}).`:
    (S.radar.used+cifUSD>RADAR[S.radar.level].limit)?`Estoura o limite do Radar ${RADAR[S.radar.level].name}: ${fmtU(S.radar.used+cifUSD)} CIF de ${fmtU(RADAR[S.radar.level].limit)} no semestre.`:null;
  const sh={pid:b.pid,sid:b.sid,qty,modal:b.modal,fobUSD,freight:Math.round(freightBRL(b.modal,m3)),seguro:b.seguro,insp:!!b.insp,ncmOk:stk(S,b.pid).ncmOk};
  const rate=b.lock?S.dollar*1.012:S.dollar;const c=cascade(S,sh,rate,'verde');

function solicitarLicenca(pid){const p=P(pid),l=lic(S,pid);if(!p.anu||l.status!=='none')return;confirmar({icon:'officer',title:`Solicitar ${p.anu.org} para ${p.name}?`,yes:'Solicitar',onYes:()=>doLicenca(pid),html:`<p><b>${p.anu.label}.</b> Custo de <b>${fmt(p.anu.cost)}</b> (taxas, laboratório e despachante), pago agora. Prazo previsto: <b>${p.anu.lead} mês(es)</b>, com ${Math.round(p.anu.risk*100)}% de chance de exigência que atrasa mais um mês.</p><p class="small muted">Sem a anuência o embarque não pode ser feito.</p>`});}

function finishBuy(pv,k,o,auto,rolls){const s=S,b=ui.buy,sup=SUP(b.sid),p=P(b.pid);ensureSnap();const ncmBefore={c:stk(s,b.pid).ncm,ok:stk(s,b.pid).ncmOk};const r=rel(s,sup.id);const upset=r.upsetUntil>=s.turn;

/* ===================== DECISÕES DO MÊS: registro, snapshot e desfazer ===================== */
function snapshotOf(s){const o=Object.assign({},s,{snap:null,cmds:[],replaying:false});return JSON.parse(JSON.stringify(o));}
function ensureSnap(){const s=S;if(s.replaying)return;if(!s.snap)s.snap=snapshotOf(s);}
function pushCmd(c){const s=S;if(s.replaying)return;(s.cmds||(s.cmds=[])).push(c);}
function captureSettings(s){return{mkt:s.mkt||0,prod:Object.fromEntries(PRODUCTS.map(p=>[p.id,{price:stk(s,p.id).price,channel:stk(s,p.id).channel}]))};}
function applySettings(s,st){s.mkt=st.mkt;for(const p of PRODUCTS){if(st.prod[p.id]){stk(s,p.id).price=st.prod[p.id].price;stk(s,p.id).channel=st.prod[p.id].channel;}}}
function replayCmd(c){const s=S;
  switch(c.t){
    case 'buy':{ui.buy={...c.b};const st=stk(s,c.b.pid);if(st.ncm===null&&c.ncm){st.ncm=c.ncm;st.ncmOk=c.ncmOk;}const pv=buyPreview();if(pv.err||s.cash<pv.sinal)return false;const sup=SUP(c.b.sid);const o=c.auto==='promise'?{why:''}:(sup.opts.find(x=>x.k===c.k)||{why:''});finishBuy(pv,c.k,o,c.auto,{late:!!c.late,scam:!!c.scam});return true;}
    case 'licenca':{const p=P(c.pid);if(!p||!p.anu||lic(s,c.pid).status!=='none'||s.cash<p.anu.cost)return false;doLicenca(c.pid);return true;}
    case 'warehouse':if(c.i<=s.wh)return false;doWarehouse(c.i);return true;
    case 'sistema':if(c.lv<=sysLv(s))return false;doSistema(c.lv);return true;
    case 'buyer':if(s.up.buyer)return false;doBuyer();return true;
    case 'radar':{const nx=RADAR[s.radar.level+1];if(!nx||s.imports<nx.req||s.cash<nx.cost)return false;doRadar();return true;}
    case 'filial':if((s.filial&&s.filial.status!=='none')||s.cash<FILIAL.setup)return false;doFilial();return true;
    case 'loan':if(c.amt<0&&s.loans[c.kind]<=0)return false;doLoan(c.kind,c.amt);return true;
    case 'antecipar':if(!s.recv.length)return false;doAntecipar();return true;
  }return false;}
function undoCmd(i){const s=S;if(!s.snap)return;const keep=(s.cmds||[]).filter((_,j)=>j!==i);const removed=(s.cmds||[])[i];const settings=captureSettings(s);const rng=s.rng;const snap=s.snap;const buyNow={...ui.buy};
  const restored=JSON.parse(JSON.stringify(snap));restored.snap=snap;restored.cmds=[];restored.replaying=true;S=restored;applySettings(S,settings);
  const dropped=[];for(const c of keep){let ok=false;try{ok=replayCmd(c);}catch(e){ok=false;}if(ok)S.cmds.push(c);else dropped.push(c);}
  S.replaying=false;S.rng=rng;ui.buy=buyNow;if(!S.cmds.length)S.snap=null;log(S,`Desfez: ${removed.desc}.`);renderGame();revisarMes(dropped,removed);}
function revisarMes(dropped,removed){const s=S;const cmds=s.cmds||[];const set=captureSettings(s);
  const vendas=PRODUCTS.map(p=>{const st=stk(s,p.id);if(!st.qty)return null;const d=demandFor(s,p.id,st.price,st.channel,1);const q=Math.min(st.qty,Math.round(d.mp)+Math.round(d.b2b));return q?`${q} ${p.name}`:null;}).filter(Boolean);
  const chegadas=s.ships.filter(x=>x.eta<=s.turn).map(x=>`${x.qty} ${P(x.pid).name} (${MODAIS[x.modal].name.split(' (')[0]})`);
  const fixos=FIXED_COST+WAREHOUSES[s.wh].rent+SYSTEMS[sysLv(s)].fee-(sysLv(s)>=2?800:0)-(sysLv(s)>=3?800:0)+(s.up.buyer?BUYER_FEE:0)+(s.filial&&s.filial.status!=='none'?FILIAL.rent:0)+(s.mkt||0);
  const sem=s.ships.length===0&&PRODUCTS.every(p=>stk(s,p.id).qty===0)&&s.turn<12;
  openModal({icon:'coin',title:`Revisar e fechar ${monthName(s.turn)}`,html:`

   <h3 style="margin-top:10px">Ajustes em vigor</h3>
   <div class="tbl"><table>${PRODUCTS.filter(p=>stk(s,p.id).qty>0||stk(s,p.id).avg>0||s.ships.some(x=>x.pid===p.id)).map(p=>`<tr><td>${p.name}</td><td class="n">${fmt(set.prod[p.id].price)}</td><td>${set.prod[p.id].channel==='ambos'?'marketplace + B2B':set.prod[p.id].channel}</td></tr>`).join('')}<tr><td>Marketing</td><td class="n">${fmt(set.mkt)}/mês</td><td>demanda +${Math.round(mktLift(set.mkt)*100)}%</td></tr></table></div>
   <div class="row" style="margin-top:6px"><button data-room="vendas">Ajustar preços e marketing</button><button data-room="comprar">Ir para compras</button><button data-room="investir">Ir para a Diretoria</button></div>
   <h3 style="margin-top:10px">O que vai acontecer no fechamento</h3>
   <p class="small"><b>Vendas previstas:</b> ${vendas.length?vendas.join(', '):'nenhuma (sem estoque)'}.<br><b>Chegadas:</b> ${chegadas.length?chegadas.join(', ')+'. Saldo ao fornecedor e tributos serão pagos agora.':'nenhuma'}.<br><b>Custos fixos:</b> ${fmt(fixos)}${s.loans.giro+s.loans.finimp?` · <b>juros:</b> ${fmt(Math.round(s.loans.giro*giroRate(s)+s.loans.finimp*FINIMP_RATE))}`:''}.</p>
   ${sem?mia('Você não tem estoque nem pedidos a caminho. O mês vai passar só com custo fixo.'):s.cash<0?mia('Seu caixa já está negativo além do limite de crédito. Se fechar negativo de novo, o banco encerra a conta.'):''}`,
   buttons:[{label:'Voltar e ajustar'},{label:`Fechar ${monthName(s.turn)}`,cls:'primary',onClick:closeMonth}],

/* ===================== INVESTIMENTOS E FINANÇAS ===================== */
function doWarehouse(i){if(i<=S.wh)return;ensureSnap();S.wh=i;pushCmd({t:'warehouse',i,desc:`Alugou ${WAREHOUSES[i].name} (${fmt(WAREHOUSES[i].rent)}/mês)`,custo:0});S.stats.galpaoNunca=false;log(S,`Alugou ${WAREHOUSES[i].name}.`);renderGame();}
function buyWarehouse(i){if(i<=S.wh)return;const w=WAREHOUSES[i];confirmar({icon:'container',title:`Alugar ${w.name}?`,yes:'Alugar',onYes:()=>doWarehouse(i),html:`<p><b>${w.cap} m³</b> por <b>${fmt(w.rent)}/mês</b>, cobrado a partir deste fechamento e sem volta. ${w.desc}</p>`});}
function contratarSistema(lv){const t=SYSTEMS[lv];if(lv<=sysLv(S))return;confirmar({icon:lv>=2?'mia':'box',title:`${sysLv(S)>0?'Mudar para':'Contratar'} ${t.name} por ${fmt(t.fee)}/mês?`,yes:sysLv(S)>0?'Fazer upgrade':'Contratar',onYes:()=>doSistema(lv),html:`<p>${t.desc}</p><p class="small muted">Mensalidade cobrada em cada fechamento. Não há downgrade.</p>`});}
function doSistema(lv){ensureSnap();pushCmd({t:'sistema',lv,desc:`Contratou ${SYSTEMS[lv].name} (${fmt(SYSTEMS[lv].fee)}/mês)`,custo:0});S.sys=lv;S.up.maino=lv>=2;if(lv>=2&&!S.stats.mainoTurn)S.stats.mainoTurn=S.turn;log(S,`Contratou ${SYSTEMS[lv].name}.`);renderGame();}
function buyMaino(){confirmar({icon:'mia',title:`Contratar a Mainô por ${fmt(MAINO_FEE)}/mês?`,yes:'Contratar',onYes:doMaino,html:`<p>NF-e de importação sem erro, metade do risco de canal vermelho, aviso antecipado de mudança de alíquota, sugestão de NCM. Economiza R$ 800/mês de retrabalho e R$ 500 por processo no despachante.</p>`});}
function doMaino(){doSistema(2);}
function buyBuyer(){confirmar({icon:'sup2',title:`Contratar comprador internacional por ${fmt(BUYER_FEE)}/mês?`,yes:'Contratar',onYes:doBuyer,html:`<p>Fala a língua do fornecedor: toda negociação fecha com o melhor desconto. Custo fixo mensal até o fim do ano.</p>`});}
function doBuyer(){ensureSnap();pushCmd({t:'buyer',desc:`Contratou comprador internacional (${fmt(BUYER_FEE)}/mês)`,custo:0});S.up.buyer=true;log(S,'Contratou comprador internacional.');renderGame();}
function abrirFilial(){const s=S;if(s.filial&&s.filial.status!=='none')return;const falta=s.imports<FILIAL.reqImports?`Exige ${FILIAL.reqImports} importações concluídas (você tem ${s.imports}).`:s.radar.level<FILIAL.reqRadar?'Exige Radar Limitada ou Ilimitada.':s.cash<FILIAL.setup?'Caixa insuficiente.':null;if(falta)return;
  confirmar({icon:'office',title:`Abrir ${FILIAL.name} por ${fmt(FILIAL.setup)}?`,yes:'Abrir filial',onYes:doFilial,html:`<p><b>Implantação:</b> ${fmt(FILIAL.setup)} agora (abertura, inscrição estadual, estrutura, consultoria para o TTD). <b>Custo fixo:</b> ${fmt(FILIAL.rent)}/mês a partir de agora. <b>Pronta em ${FILIAL.lead} meses.</b></p><p><b>Efeito:</b> ICMS da importação diferido no desembaraço (hoje 18% por dentro) e carga efetiva de ${(FILIAL.icmsEfetivo*100).toFixed(1).replace('.',',')}% sobre as vendas; mais ${FILIAL.cap} m³ de galpão.</p><p class="small muted">Benefício oneroso: a filial precisa operar de verdade. Com a Reforma Tributária os benefícios de ICMS caem gradualmente de 2029 a 2032.</p>`});}
function doFilial(){const s=S;ensureSnap();pushCmd({t:'filial',desc:`Abriu ${FILIAL.name}`,custo:FILIAL.setup});s.cash-=FILIAL.setup;cfAdd('invest',FILIAL.setup);s.filial={status:'setup',ready:s.turn+FILIAL.lead};log(s,`Abriu ${FILIAL.name}: ${fmt(FILIAL.setup)}. Operação prevista para ${monthName(s.filial.ready)}.`);renderGame();}
function upRadar(){const nx=RADAR[S.radar.level+1];if(!nx||S.imports<nx.req||S.cash<nx.cost)return;confirmar({icon:'officer',title:`Habilitar Radar ${nx.name} por ${fmt(nx.cost)}?`,yes:'Habilitar',onYes:doRadar,html:`<p>Limite passa para <b>${nx.limit===Infinity?'ilimitado':fmtU(nx.limit)+' CIF por semestre'}</b>. O valor cobre consultoria e revisão da capacidade financeira estimada e sai do caixa agora.</p>`});}
function doRadar(){const nx=RADAR[S.radar.level+1];if(!nx)return;ensureSnap();pushCmd({t:'radar',desc:`Habilitou Radar ${nx.name}`,custo:nx.cost});S.cash-=nx.cost;cfAdd('invest',nx.cost);S.radar.level++;log(S,`Radar ${nx.name} habilitado.`);renderGame();}
function loan(kind,amt){amt=Math.round(amt);if(!amt)return;const nome=kind==='giro'?'capital de giro':'FINIMP';const taxa=kind==='giro'?giroRate(S):FINIMP_RATE;if(amt>0)confirmar({icon:'coin',title:`Tomar ${fmt(amt)} de ${nome}?`,yes:'Tomar crédito',onYes:()=>doLoan(kind,amt),html:`<p>Juros de <b>${(taxa*100).toFixed(1)}% ao mês</b> (${fmt(Math.round(amt*taxa))}/mês) cobrados em cada fechamento até você quitar.</p>`});else confirmar({icon:'coin',title:`Pagar ${fmt(-amt)} de ${nome}?`,yes:'Pagar',onYes:()=>doLoan(kind,amt),html:`<p>Sai do caixa agora e reduz os juros do próximo fechamento.</p>`});}
function doLoan(kind,amt){const max=kind==='giro'?GIRO_MAX:FINIMP_MAX;ensureSnap();pushCmd({t:'loan',kind,amt,desc:`${amt>0?'Tomou':'Pagou'} ${fmt(Math.abs(amt))} de ${kind==='giro'?'capital de giro':'FINIMP'}`,custo:0});
  if(amt>0){amt=Math.min(amt,max-S.loans[kind]);S.loans[kind]+=amt;S.cash+=amt;cfAdd('credito',amt);log(S,`Tomou ${fmt(amt)} de ${kind==='giro'?'capital de giro':'FINIMP'}.`);}
  else{amt=Math.min(-amt,S.loans[kind],S.cash);S.loans[kind]-=amt;S.cash-=amt;cfAdd('credito',-amt);log(S,`Pagou ${fmt(amt)} de ${kind==='giro'?'capital de giro':'FINIMP'}.`);}
  renderGame();}
function antecipar(){const tot=S.recv.reduce((a,r)=>a+r.amount,0);if(!tot)return;confirmar({icon:'coin',title:`Antecipar ${fmt(tot)} em recebíveis?`,yes:'Antecipar',onYes:doAntecipar,html:`<p>Você recebe <b>${fmt(Math.round(tot*0.95))}</b> hoje e abre mão de ${fmt(Math.round(tot*0.05))} de deságio (5%).</p>`});}
function doAntecipar(){const tot=S.recv.reduce((a,r)=>a+r.amount,0);if(!tot)return;ensureSnap();pushCmd({t:'antecipar',desc:`Antecipou ${fmt(tot)} em recebíveis (FIDC)`,custo:Math.round(tot*0.05)});const net=Math.round(tot*0.95);S.cash+=net;cfAdd('antecip',net);S.m.other+=tot-net;S.recv=[];log(S,`Antecipou ${fmt(tot)} em recebíveis via FIDC. Recebeu ${fmt(net)}.`);renderGame();}

/* ===================== MIA ===================== */
function mia(t){return `<div class="mia-note"><div class="av">${spr('mia',2)}</div><div>${t}</div></div>`;}
function coverage(s,pid){const st=stk(s,pid);const d=demandFor(s,pid,st.price,st.channel,1);const dem=Math.round(d.mp)+Math.round(d.b2b);const transit=s.ships.filter(x=>x.pid===pid);const next=transit.length?Math.min(...transit.map(x=>x.eta)):null;return{dem,months:dem>0?st.qty/dem:(st.qty>0?99:0),next,transitQty:transit.reduce((a,x)=>a+x.qty,0)};}
function miaTip(s){const m=(s.turn-1)%12;
  {const risco=PRODUCTS.map(p=>({p,c:coverage(s,p.id)})).filter(x=>stk(s,x.p.id).qty>0&&x.c.months<2.2&&(x.c.next==null||x.c.next>s.turn+Math.ceil(x.c.months)));if(risco.length){const x=risco[0];return `${x.p.name}: o estoque cobre ${x.c.months<1?'menos de 1 mês':Math.floor(x.c.months)+' mês(es)'} e ${x.c.next?'o próximo embarque só chega em '+monthName(x.c.next):'não há embarque a caminho'}. Marítimo leva 2 meses: peça agora ou vai faltar.`;}}
  const semLic=PRODUCTS.filter(p=>p.anu&&lic(s,p.id).status==='none');if(semLic.length===PRODUCTS.filter(p=>p.anu).length&&semLic.length&&s.ships.length===0)return `Neste segmento ${semLic.length===PRODUCTS.length?'todo produto':semLic.map(p=>p.name).join(', ')} exige anuência antes do embarque. Solicite na sala de compras: leva ${Math.max(...semLic.map(p=>p.anu.lead))} mês(es).`;
  const due=SUPPLIERS.find(x=>{const r=rel(s,x.id);return r.promise&&r.promise.deadline===s.turn;});if(due)return `Você prometeu recorrência a ${due.name} e o prazo do próximo pedido é este mês. Um pedido pequeno mantém o acordo e o desconto.`;
  if(s.turn===1&&s.ships.length===0)return 'Primeiro mês: compre. Um LCL de 200 a 400 unidades leva 2 meses pra chegar. Enquanto isso, o custo fixo corre.';
  if(brand(s)<0.8)return `Confiança da marca em ${Math.round(brand(s)*100)}%: clientes saíram sem comprar. Garanta estoque antes de gastar em marketing; ela sobe 10 pontos por mês atendido.`;
  if((s.mkt||0)>0){const tot=PRODUCTS.reduce((a,p)=>{const st=stk(s,p.id);if(!(st.avg>0||st.qty>0))return a;const d=demandFor(s,p.id,st.price,st.channel,1);return a+Math.round(d.mp)+Math.round(d.b2b);},0);const est=PRODUCTS.reduce((a,p)=>a+stk(s,p.id).qty,0);if(tot>est*1.2)return `Você está gastando ${fmt(s.mkt)} em marketing com estoque para ${est} unidades e demanda prevista de ${tot}. Compre antes de anunciar.`;}
  if(s.ships.some(x=>!x.insp&&riskNoInsp(SUP(x.sid))>=0.1))return 'Você tem embarque sem inspeção com fornecedor de confiabilidade baixa. Da próxima vez, R$ 1.800 de inspeção protegem um lote de dezenas de milhares.';
  if(s.cash<0)return 'Caixa negativo além do limite de crédito. Mais um mês assim e acabou. Venda estoque, antecipe recebíveis ou segure compras.';
  if(s.ships.length&&stockM3(s)+s.ships.reduce((a,x)=>a+x.qty*P(x.pid).m3,0)>whCap(s))return 'O que está chegando não cabe no seu espaço. Vai pro 3PL a R$ 150/m³. Compare com o aluguel de galpão em Investir.';
  if(s.dHist.length>=3&&s.dollar>s.dHist[s.dHist.length-3]*1.04)return 'Dólar em alta há dois meses. Travar o câmbio custa 1,2% e tira o risco do saldo que vence na chegada.';
  if(m>=7&&m<=9)return 'Novembro e dezembro concentram metade das vendas do ano. Pedido marítimo agora chega a tempo da Black Friday.';
  if(m===10||m===11)return 'Pico de demanda. Preço acima do mercado ainda vende. Não deixe estoque pra janeiro, que é fraco.';
  if(sysLv(s)===0&&(PRODUCTS.some(p=>stk(s,p.id).qty>0)||s.ships.length))return 'Você vai vender sem emitir nota. Marketplace fechado, metade dos clientes B2B some e 20% de chance por mês de a fiscalização parar a operação. Contrate ao menos um sistema generalista na Diretoria.';
  if(sysLv(s)===1&&s.imports>=2)return 'Você já teve chegadas com ERP generalista: cada uma tem 35% de chance de erro na NF-e de importação. O Mainô Operação elimina isso por R$ 990/mês.';
  if(s.radar.used>RADAR[s.radar.level].limit*0.7&&s.radar.level<2)return 'Seu Radar está perto do limite do semestre. Subir de nível em Investir libera volume.';
  if(s.cash>120000&&s.ships.length===0)return 'Dinheiro parado não importa nada. Capital em caixa sem estoque é custo de oportunidade.';
  return 'Faturamento não é lucro. Olhe a margem depois de comissão, tributos e fixos no fechamento de cada mês.';
}

/* Cena da base: escritório, galpões, pátio de contêineres, navios e aviões chegando, caminhão saindo. */
let sceneRaf=0, sceneT0=performance.now();
function drawBase(){const c=$('#base');if(!c)return;cancelAnimationFrame(sceneRaf);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frame=()=>{renderScene(c,(performance.now()-sceneT0)/1000);if(!reduce&&document.body.contains(c))sceneRaf=requestAnimationFrame(frame);};
  frame();
}
function renderScene(c,t){const x=c.getContext('2d');const s=S;const W=c.width,H=c.height,sc=3;x.imageSmoothingEnabled=false;
  const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';
  x.fillStyle=dark?'#16213A':'#DCEBF7';x.fillRect(0,0,W,H);              // céu
  x.fillStyle=dark?'#1C3B5A':'#9ED2F2';x.fillRect(W*0.56,H*0.62,W*0.44,H*0.38); // mar
  x.fillStyle=dark?'#2A3B2E':'#BFE3C8';x.fillRect(0,H*0.62,W*0.56,H*0.38);      // terra
  x.fillStyle=dark?'#3A4356':'#8E99AA';x.fillRect(0,H*0.86,W*0.56,H*0.08);      // estrada
  x.fillStyle=dark?'#5B6B82':'#D9E1EA';x.fillRect(W*0.52,H*0.58,W*0.06,H*0.42); // cais
  // prédios
  drawSpr(x,'office',12,H*0.62-17*sc,sc);
  if(hasMaino(s)){x.fillStyle='#00B386';x.fillRect(12+8*sc,H*0.62-24*sc,36,12);x.fillStyle='#06251C';x.font='800 10px "Barlow Condensed",sans-serif';x.fillText('MAINÔ',12+8*sc+3,H*0.62-24*sc+10);}
  if(s.wh>=1)drawSpr(x,'galpao',90,H*0.62-13*sc,sc);
  if(s.wh>=2)drawSpr(x,'galpao',90+38*sc,H*0.62-13*sc,sc);
  if(filialOk(s)){drawSpr(x,'galpao',W*0.36,H*0.62-13*sc-30,2);x.fillStyle='#00B386';x.font='700 9px Barlow';x.fillText('FILIAL SC',W*0.36+4,H*0.62-13*sc-34);}
  // pátio: 1 contêiner a cada 8 m³ em estoque (máx. 10)
  const n=Math.min(10,Math.ceil(stockM3(s)/8));const px0=W*0.33,py0=H*0.62+6;
  for(let i=0;i<n;i++){const row=Math.floor(i/5),col=i%5;drawSpr(x,i%2?'containerG':'container',px0+col*17*(sc-1)+row*6,py0+row*(-7*(sc-1))-row*2,sc-1);}
  // navios: posição proporcional ao progresso do embarque marítimo
  s.ships.filter(sh=>sh.modal==='fcl'||sh.modal==='lcl').slice(0,3).forEach((sh,i)=>{const lead=MODAIS[sh.modal].lead+(sh.late?1:0);const p=Math.max(0,Math.min(1,1-(sh.eta-s.turn)/Math.max(1,lead)));
    const sx=W-110-(W*0.30)*p;const bob=Math.sin(t*2+i)*2;drawSpr(x,'ship',sx-i*14,H*0.62-9*sc+bob+i*6,sc,true);});
  // aviões
  s.ships.filter(sh=>sh.modal==='aereo'||sh.modal==='courier').slice(0,2).forEach((sh,i)=>{const p=(t*0.08+i*0.5)%1;drawSpr(x,'plane',W-(W+60)*p,10+i*22+Math.sin(t*3+i)*1.5,2,true);});
  // caminhão: sai quando houve venda no último mês
  const last=s.hist[s.hist.length-1];if(last&&last.m.units>0){const p=(t*0.12)%1;drawSpr(x,'truck',-40+(W*0.6)*p,H*0.86-7*sc+2,sc);}
  // legenda
  x.fillStyle=dark?'#E8EEF6':'#1A2B4A';x.font='600 11px Barlow,sans-serif';x.globalAlpha=.8;
  x.fillText(WAREHOUSES[s.wh].name+' · '+stockM3(s).toFixed(1)+'/'+whCap(s)+' m³',12,H-6);x.globalAlpha=1;
}

const roomCX=i=>i*(OFF.W/ROOMS.length)+OFF.W/ROOMS.length/2;

function avatarPos(){
  if(!walk)return{x:roomCX(roomIdx(ui.room)),y:OFF.standY,frame:0,flip:false};
  const t=(performance.now()-walk.t0)/1000*OFF.speed;const seg=walk.segs;let d=t;
  for(let i=0;i<seg.length;i++){const [a,b]=seg[i];const len=Math.hypot(b.x-a.x,b.y-a.y);if(d<=len){const k=len?d/len:1;return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,frame:Math.floor(performance.now()/140)%2,flip:b.x<a.x||(b.x===a.x&&walk.flip)};}d-=len;}
  return{x:seg[seg.length-1][1].x,y:seg[seg.length-1][1].y,frame:0,flip:walk.flip,done:true};
}
function goRoom(id){
  if(id===ui.room&&!walk){renderPanel();return;}
  const from=avatarPos();const toX=roomCX(roomIdx(id));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ui.room=id;walk=null;renderPanel();drawOffice();highlightRoom();return;}
  walk={target:id,t0:performance.now(),flip:toX<from.x,segs:[[{x:from.x,y:from.y},{x:from.x,y:OFF.corrY}],[{x:from.x,y:OFF.corrY},{x:toX,y:OFF.corrY}],[{x:toX,y:OFF.corrY},{x:toX,y:OFF.standY}]]};
  const tab=$('#tab');if(tab)tab.innerHTML=`<div class="panel walking">${avatarImg(myAvatar(),3)} <span>${myAvatar().name} está indo para <b>${ROOMS[roomIdx(id)].name}</b>…</span></div>`;
  highlightRoom(id);
  cancelAnimationFrame(officeRaf);
  const total=walk.segs.reduce((a,[p1,p2])=>a+Math.hypot(p2.x-p1.x,p2.y-p1.y),0);
  const arrive=()=>{if(!walk||walk.target!==id)return;clearTimeout(walk.timer);ui.room=id;walk=null;drawOffice();renderPanel();};
  walk.timer=setTimeout(arrive,total/OFF.speed*1000+120); // garante a chegada mesmo se o navegador pausar a animação
  const loop=()=>{if(!walk)return;const p=avatarPos();drawOffice();if(p.done)arrive();else officeRaf=requestAnimationFrame(loop);};
  loop();
}

function animateStats(prev){if(typeof requestAnimationFrame!=='function'||typeof matchMedia!=='function'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const els=Array.from(document.querySelectorAll('.stat b[data-k]')||[]);const D=1400;
  const items=els.map(el=>{const k=el.dataset.k,to=parseFloat(el.dataset.v),from=prev[k];if(!isFinite(to)||!isFinite(from)||Math.abs(to-from)<0.005)return null;el.parentElement.classList.add(to>from?'up':'down');return {el,k,from,to,pre:el.dataset.pre||'',suf:el.dataset.suf?' '+el.dataset.suf:''};}).filter(Boolean);
  if(!items.length)return;let t0=null;
  const step=now=>{if(t0===null)t0=now;const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);
    for(const it of items){const v=p<1?it.from+(it.to-it.from)*e:it.to;it.el.textContent=it.pre+STAT_FMT[it.k](v)+it.suf;}
    if(p<1)requestAnimationFrame(step);else setTimeout(()=>items.forEach(it=>it.el.parentElement.classList.remove('up','down')),800);};
  requestAnimationFrame(step);}

function projectCash(s){const rows=[];let cash=s.cash;const stock=Object.fromEntries(PRODUCTS.map(p=>[p.id,stk(s,p.id).qty]));const recv={};for(const r of s.recv){recv[r.due]=(recv[r.due]||0)+r.amount;}
  const fixos=FIXED_COST+WAREHOUSES[s.wh].rent+SYSTEMS[sysLv(s)].fee-(sysLv(s)>=2?800:0)-(sysLv(s)>=3?800:0)+(s.up.buyer?BUYER_FEE:0)+(s.filial&&s.filial.status!=='none'?FILIAL.rent:0)+(s.mkt||0);
  const juros=Math.round(s.loans.giro*giroRate(s)+s.loans.finimp*FINIMP_RATE);const saveTurn=s.turn;
  for(let m=s.turn;m<=12;m++){s.turn=m;let vendas=0,b2bNew=0,ttd=0;
    for(const p of PRODUCTS){const st=stk(s,p.id);if(stock[p.id]<=0)continue;const d=demandFor(s,p.id,st.price,st.channel,1);let left=stock[p.id];const qMp=Math.min(left,Math.round(d.mp));left-=qMp;const qB=Math.min(left,Math.round(d.b2b));left-=qB;stock[p.id]=left;vendas+=qMp*st.price*0.82;b2bNew+=qB*st.price;if(filialOk(s)&&(s.filial.ready||0)<=m)ttd+=Math.round((qMp+qB)*st.price*FILIAL.icmsEfetivo);}
    if(b2bNew>0)recv[m+2]=(recv[m+2]||0)+b2bNew;
    let chegadas=0;for(const sh of s.ships.filter(x=>x.eta===m)){const sup=SUP(sh.sid);const c=cascade(s,sh,s.dollar,'verde');chegadas+=sh.fobUSD*(1-sup.deposit)*(sh.lockRate||s.dollar)+(c.total-c.fobBRL);stock[sh.pid]=(stock[sh.pid]||0)+sh.qty;}
    const recebidos=recv[m]||0;const ent=vendas+recebidos;const sai=chegadas+fixos+juros+ttd;cash+=ent-sai;
    rows.push({turn:m,month:monthName(m),vendasVista:Math.round(vendas),recebidos:Math.round(recebidos),chegadas:Math.round(chegadas),fixos,juros,ttd,cashEnd:Math.round(cash),prev:true});}
  s.turn=saveTurn;return rows;}
function projectStock(s){const stock=Object.fromEntries(PRODUCTS.map(p=>[p.id,stk(s,p.id).qty]));const out=[];const saveTurn=s.turn;
  for(let m=s.turn;m<=12;m++){s.turn=m;const row={turn:m,month:monthName(m),prods:{}};
    for(const p of PRODUCTS){const st=stk(s,p.id);const start=stock[p.id];const d=demandFor(s,p.id,st.price,st.channel,1);const dem=Math.round(d.mp)+Math.round(d.b2b);const sold=Math.min(start,dem);let end=start-sold;
      if(SEG.validade&&end>0)end-=Math.floor(end*SEG.validade);
      const arr=s.ships.filter(x=>x.pid===p.id&&x.eta===m).reduce((a,x)=>a+x.qty,0);const l=lic(s,p.id);const licAt=!p.anu||l.status==='ok'||(l.status==='pending'&&l.ready<=m);const held=arr>0&&!licAt;
      end+=held?0:arr;stock[p.id]=end;row.prods[p.id]={start,dem,sold,unmet:Math.max(0,dem-sold),arr:held?0:arr,held,end};}
    out.push(row);}
  s.turn=saveTurn;return out;}
function stockProjHTML(s){const rows=projectStock(s);const active=PRODUCTS.filter(p=>stk(s,p.id).qty>0||s.ships.some(x=>x.pid===p.id));if(!active.length)return '<p class="small muted">Sem estoque nem embarques a caminho: a projeção aparece depois do primeiro pedido.</p>';
  return `<div class="tbl"><table><tr><th>Produto</th>${rows.map(r=>`<th class="n">${r.month}</th>`).join('')}</tr>
  ${active.map(p=>`<tr><td>${spr(p.id,2)} ${p.name}</td>${rows.map(r=>{const c=r.prods[p.id];const cls=c.unmet>0?'bad':c.end===0?'muted':c.end>c.dem*4&&c.dem>0?'warn':'';return `<td class="n small ${cls}"><b>${c.end}</b>${c.arr?`<br><span class="good">+${c.arr}</span>`:c.held?'<br><span class="bad">retida</span>':''}${c.unmet>0?`<br><span class="bad">falta ${c.unmet}</span>`:''}</td>`;}).join('')}</tr>`).join('')}</table></div>
  <p class="small muted" style="margin-top:6px">Estoque no fim de cada mês, considerando a demanda prevista aos preços, canais, marketing e confiança de hoje, as chegadas a caminho (em verde, somadas depois da venda do mês) e a validade. Vermelho: clientes vão faltar produto. Não inclui compras novas.</p>`;}
function cashflowHTML(s){const real=s.hist.map(h=>({turn:h.turn,month:h.month,...(h.cf||{}),cashStart:h.cashStart,cashEnd:h.m.cashEnd,prev:false}));const proj=projectCash(s);const all=real.concat(proj);
  const minP=proj.reduce((a,r)=>r.cashEnd<a.cashEnd?r:a,proj[0]||{cashEnd:Infinity});
  const td=(v,cls)=>`<td class="n ${cls||''}">${v?fmt(v):'–'}</td>`;
  return `<div class="tbl dense"><table><tr><th>Mês</th><th class="n">À vista</th><th class="n">Recebidos</th><th class="n">Crédito/FIDC</th><th class="n">Chegadas</th><th class="n">Sinais+invest.</th><th class="n">Fixos+juros</th><th class="n">Outros</th><th class="n">Caixa final</th></tr>
  ${all.map(r=>`<tr class="${r.prev?'prev':''}"><td>${r.month}${r.prev?' <span class="pill info">previsto</span>':''}</td>${td(r.vendasVista)}${td(r.recebidos)}${r.prev?'<td class="n">–</td>':td((r.credito||0)+(r.antecip||0),(r.credito||0)+(r.antecip||0)<0?'bad':'')}${td(r.chegadas,'bad')}${r.prev?'<td class="n">–</td>':td((r.sinais||0)+(r.invest||0),'bad')}${td((r.fixos||0)+(r.juros||0)+(r.ttd||0),'bad')}${r.prev?'<td class="n">–</td>':td(r.outros,(r.outros||0)<0?'bad':'')}<td class="n" style="font-weight:700" ${r.cashEnd<0?'class="n bad"':''}><span class="${r.cashEnd<0?'bad':''}">${fmt(r.cashEnd)}</span></td></tr>`).join('')}</table></div>
  <p class="small muted" style="margin-top:6px">Realizado: o que de fato entrou e saiu. Previsto: recebíveis já contratados, embarques a caminho (saldo e tributos ao dólar de hoje), vendas do estoque atual e das chegadas aos preços de hoje, custos fixos, marketing e juros atuais; não inclui novas compras nem eventos. "Outros" = multas, perdas, pedidos à vista de eventos e ajustes.</p>
  ${proj.length&&minP.cashEnd<0?mia(`Pelo que já está contratado, o caixa fica negativo em ${minP.month} (${fmt(minP.cashEnd)}). Antecipe recebíveis, tome crédito antes, ou segure compras até as chegadas serem pagas.`):proj.length?mia(`Menor caixa previsto: ${fmt(minP.cashEnd)} em ${minP.month}. Compra nova só se couber nesse piso, porque saldo e tributos chegam juntos.`):''}`;}

   <h3 style="margin-top:14px">Crédito</h3>
   <div class="row" style="margin-top:6px"><div style="flex:1;min-width:240px"><b>Capital de giro</b> ${tip(`Crédito rápido do banco, ${(giroRate(s)*100).toFixed(1)}% ao mês sobre o saldo devedor, cobrado em cada fechamento. Use como ponte entre pagar o fornecedor e receber do cliente, nunca para financiar prejuízo.`)} · ${(giroRate(s)*100).toFixed(1)}% ao mês · limite ${fmt(GIRO_MAX)}<br><span class="small muted">Saldo devedor ${fmt(s.loans.giro)}</span><div class="row" style="margin-top:6px"><input type="number" id="giroAmt" step="5000" value="20000"><button data-loan="giro" data-dir="1">Tomar</button><button data-loan="giro" data-dir="-1" ${!s.loans.giro?'disabled':''}>Pagar</button></div></div>
   <div style="flex:1;min-width:240px"><b>FINIMP</b> ${tip('Financiamento à importação: linha bancária em moeda estrangeira para pagar o fornecedor, com juros menores que o giro. Exige histórico: liberada após 2 importações concluídas.')} · ${(FINIMP_RATE*100).toFixed(1)}% ao mês · limite ${fmt(FINIMP_MAX)}<br><span class="small muted">${s.imports>=2?'Saldo devedor '+fmt(s.loans.finimp):'Liberado após 2 importações concluídas (você tem '+s.imports+')'}</span><div class="row" style="margin-top:6px"><input type="number" id="finAmt" step="5000" value="50000" ${s.imports<2?'disabled':''}><button data-loan="finimp" data-dir="1" ${s.imports<2?'disabled':''}>Tomar</button><button data-loan="finimp" data-dir="-1" ${!s.loans.finimp?'disabled':''}>Pagar</button></div></div></div>
   <div class="row" style="margin-top:12px"><div><b>Antecipar recebíveis (FIDC)</b> ${tip('Um fundo (FIDC) compra seus recebíveis B2B e paga à vista com 5% de deságio. Transforma venda a prazo em caixa hoje; custa mais que esperar, mas menos que o capital de giro.')}<br><span class="small muted">${recv?'Recebe '+fmt(recv*0.95)+' hoje em vez de '+fmt(recv)+' em até 60 dias.':'Nenhum recebível em aberto.'}</span></div><button id="fidc" ${!recv?'disabled':''}>Antecipar</button></div>
   ${mia('Juros de giro a 3,2% ao mês comem qualquer margem de eletrônicos. Use crédito pra atravessar o intervalo entre pagar o fornecedor e receber do cliente, nunca pra financiar prejuízo.')}</div>
   ${s.hist.length?`<div class="panel"><h3>Histórico mensal</h3><div class="tbl"><table><tr><th>Mês</th><th class="n">Receita</th><th class="n">Margem bruta</th><th class="n">Fixos</th><th class="n">Resultado</th><th class="n">Caixa</th></tr>${s.hist.map(h=>`<tr><td>${h.month}</td><td class="n">${fmt(h.m.rev)}</td><td class="n">${fmt(h.m.margin)}</td><td class="n">-${fmt(h.m.fixed+h.m.interest+h.m.nfe+h.m.other)}</td><td class="n ${h.m.result<0?'bad':'good'}">${fmt(h.m.result)}</td><td class="n">${fmt(h.m.cashEnd)}</td></tr>`).join('')}</table></div></div>`:''}`;
  document.querySelectorAll('[data-loan]').forEach(b=>b.onclick=()=>{const amt=+$(b.dataset.loan==='giro'?'#giroAmt':'#finAmt').value;loan(b.dataset.loan,amt*(+b.dataset.dir));});
  $('#fidc').onclick=antecipar;
}

/* ===================== MODAIS ===================== */
function openModal(m){if(modalOpen){queue.unshift(m);return;}modalOpen=true;
  const ov=document.createElement('div');ov.className='overlay';ov.id='ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="mhead">${m.icon?spr(m.icon,4):''}<h2>${m.title}</h2>${m.noClose?'':'<button class="mclose" type="button" aria-label="Fechar" title="Fechar (Esc)">×</button>'}</div>${m.closeHint?`<p class="small muted" style="margin:-4px 0 8px">${m.closeHint}</p>`:''}<div class="body">${m.html}</div>${m.buttons.length?`<div class="actions">${m.buttons.map((b,i)=>`<button data-b="${i}" class="${b.cls||''}">${b.label}</button>`).join('')}</div>`:''}</div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const bt=m.buttons[+b.dataset.b];closeModal();if(bt.onClick)bt.onClick();showNext();});
  const dismiss=()=>{closeModal();if(m.onClose)m.onClose();showNext();};const xc=ov.querySelector('.mclose');if(xc)xc.onclick=dismiss;
  if(!m.noClose){ov._esc=e=>{if(e.key==='Escape'){document.removeEventListener('keydown',ov._esc);dismiss();}};document.addEventListener('keydown',ov._esc);}
  if(m.onOpen)m.onOpen();
}
function closeModal(){const ov=$('#ov');if(ov){if(ov._esc)document.removeEventListener('keydown',ov._esc);ov.remove();}modalOpen=false;}
function showNext(){if(modalOpen||!queue.length)return;openModal(queue.shift());}

/* ===================== TELA INICIAL ===================== */
let startMode='semanal', startAvatar=0, startSeg='pet';
function showStart(){
  let nick='';try{nick=localStorage.getItem('oimp.nick')||'';startAvatar=+(localStorage.getItem('oimp.avatar')||0)||0;startSeg=localStorage.getItem('oimp.seg')||startSeg;if(!SEGMENTS[startSeg])startSeg='pet';}catch(e){}
  $('#app').innerHTML=`<header class="topbar"><div class="in"><div class="brand">${mainoLogo(30)}<h1>ImportTycoon</h1><small>um jogo da Mainô</small></div></div></header>
  <div class="wrap"><div class="start">
   <div class="hero"><h1>Construa seu império de importação.</h1><p>Você começa com R$ 150 mil, uma sala e um Radar limitado. Em 12 meses, suba de Garagem a Grupo Importador ou quebre tentando. Fornecedor, modal, câmbio, NCM, canal de parametrização, tributos, galpão, canal de venda: tudo é decisão sua.</p><div class="hero-strip">${spr('ship',3)}${spr('container',3)}${spr('plane',3)}${spr('truck',3)}${spr('fone',3)}${spr('smartwatch',3)}${spr('caixa',3)}${spr('carregador',3)}</div></div>
   <div><h3 style="margin-bottom:8px">Em que segmento você vai importar?</h3><div class="modes" style="grid-template-columns:repeat(3,1fr)">${Object.values(SEGMENTS).map(g=>`<button class="mode ${startSeg===g.id?'on':''}" data-seg="${g.id}" aria-pressed="${startSeg===g.id}"><div class="row" style="justify-content:space-between"><h3>${spr(g.icon,2)} ${g.name}</h3><span class="pill ${g.level==='Fácil'?'verde':g.level==='Médio'?'amarelo':'vermelho'}">${g.level}</span></div><p class="small muted" style="margin-top:6px">${g.desc}</p></button>`).join('')}</div></div>
   <div><h3 style="margin-bottom:8px">Quem vai comandar a importadora?</h3><div class="avatars">${AVATARS.map((a,i)=>`<button class="mode av ${startAvatar===i?'on':''}" data-av="${i}" aria-pressed="${startAvatar===i}">${avatarImg(a,4)}<span>${a.name}</span></button>`).join('')}</div></div>
   <div class="row"><label class="field" style="flex:1;min-width:260px">Nome da empresa (vai no card)<input id="nick" maxlength="40" value="${esc(nick)}" placeholder="ex.: Importadora Horizonte" style="width:100%;font-size:1.1rem;padding:11px 14px"></label><button class="primary big" id="go">Abrir a empresa</button></div>
   ${FOOTER}
  </div></div>`;
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{startSeg=b.dataset.seg;try{localStorage.setItem('oimp.seg',startSeg);}catch(e){}showStart();});
  document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{startAvatar=+b.dataset.av;try{localStorage.setItem('oimp.avatar',startAvatar);}catch(e){}showStart();});
  $('#go').onclick=()=>{const n=$('#nick').value.trim()||'Minha Importadora';try{localStorage.setItem('oimp.nick',n);}catch(e){}newGame(startMode,n,startAvatar,startSeg);};
}

/* ===================== BOOT ===================== */
window.claude?.hot?.snapshot?.(()=>({S,ui,queue}));
function boot(d){if(d&&d.S){S=d.S;applySegment(S.seg||'eletronicos');ui=d.ui||ui;queue=d.queue||[];renderGame();showNext();}else showStart();}
setAppIcon();
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
</body>
